<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>设备运行监控系统</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

    <!-- ============================================================ -->
    <!-- 顶部导航 -->
    <!-- ============================================================ -->
    <header class="app-header">
        <div class="header-left">
            <span class="logo">🏭</span>
            <span class="app-title">设备运行监控</span>
        </div>
        <div class="header-right">
            <span class="user-info" id="userDisplay">
                <span class="user-name" id="userName">加载中...</span>
                <span class="user-role" id="userRole">普通用户</span>
                <span class="user-region" id="userRegion" style="margin-left:12px;font-size:13px;color:#64748b;background:#f1f4f9;padding:2px 10px;border-radius:12px;">📍 加载中...</span>
            </span>
            <button class="btn btn-logout" id="logoutBtn">退出</button>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- 统计栏 -->
    <!-- ============================================================ -->
    <div class="stats-bar">
        <div class="stats-item">
            <span class="stats-label">📅</span>
            <span class="stats-value" id="currentMonth">2026年9月</span>
        </div>
        <div class="stats-item">
            <span class="stats-label">本月总运行</span>
            <span class="stats-value" id="totalHours">0 小时</span>
        </div>
        <div class="stats-item">
            <span class="stats-label">运行中</span>
            <span class="stats-value" id="runningCount">0 台</span>
        </div>
        <div class="stats-item" id="regionFilterWrapper" style="display:none;">
            <span class="stats-label">📍 区域</span>
            <select id="regionFilter" style="padding:4px 8px;border-radius:6px;border:1px solid #d1d5db;font-size:14px;background:#fff;cursor:pointer;">
                <option value="all">全部</option>
            </select>
        </div>
        <div style="margin-left:auto;">
            <button class="btn btn-export" id="exportExcelBtn">📥 导出 Excel</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 设备类型标签栏 -->
    <!-- ============================================================ -->
    <nav class="type-tabs" id="typeTabs">
        <!-- JS 动态渲染 -->
    </nav>

    <!-- ============================================================ -->
    <!-- 工具栏 -->
    <!-- ============================================================ -->
    <div class="toolbar">
        <div class="search-box" style="position:relative;">
            <input type="text" id="searchInput" placeholder="🔍 搜索设备名称或位号..." />
            <button id="clearSearchBtn" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#999;font-size:18px;cursor:pointer;padding:4px;">✕</button>
        </div>
        <div class="toolbar-right">
            <span class="device-count" id="deviceCount">共 0 台</span>
            <button class="btn btn-admin" id="adminEntryBtn" style="display:none;">⚙️ 管理</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 设备卡片网格 -->
    <!-- ============================================================ -->
    <div class="device-grid" id="deviceGrid">
        <!-- JS 动态渲染 -->
    </div>

    <!-- ============================================================ -->
    <!-- 分页 -->
    <!-- ============================================================ -->
    <div class="pagination" id="pagination">
        <!-- JS 动态渲染 -->
    </div>

    <!-- ============================================================ -->
    <!-- 月统计报表区域 -->
    <!-- ============================================================ -->
    <section class="statistics-section" id="statisticsSection" style="display:none;">
        <div class="section-header">
            <h2>📊 本月运行统计</h2>
            <button class="btn btn-export" id="exportBtn">📥 导出 Excel</button>
        </div>

        <!-- 类型汇总 -->
        <div class="type-summary" id="typeSummary">
            <!-- JS 动态渲染 -->
        </div>

        <!-- 设备排行 -->
        <div class="rank-table-wrapper">
            <h3>🏆 设备运行时长排行</h3>
            <div class="rank-table-container" id="rankTable">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </section>

    <!-- ============================================================ -->
    <!-- 管理弹窗 -->
    <!-- ============================================================ -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modalContent">
            <!-- JS 动态渲染 -->
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- Toast 提示 -->
    <!-- ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================ -->
    <!-- 操作记录区域 -->
    <!-- ============================================================ -->
    <div id="operationsSection" style="padding:12px 16px;margin-top:16px;background:#fff;border-radius:12px;border:1px solid #eef2f7;display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h3 id="operationsTitle" style="font-size:16px;font-weight:600;color:#1e293b;">📋 我的操作记录</h3>
            <span id="operationsCount" style="font-size:13px;color:#94a3b8;"></span>
        </div>
        <div id="operationsList"></div>
    </div>

    <!-- ============================================================ -->
    <!-- 内联脚本：强制从 localStorage 恢复用户信息 + 折叠功能 -->
    <!-- ============================================================ -->
    <script>
        (function() {
            console.log('[Index] 内联脚本执行');
            const saved = localStorage.getItem('user');
            if (!saved) {
                console.log('[Index] 无用户信息，跳转登录');
                return;
            }
            try {
                const user = JSON.parse(saved);
                console.log('[Index] 用户信息:', user);
                const nameEl = document.getElementById('userName');
                const roleEl = document.getElementById('userRole');
                const regionEl = document.getElementById('userRegion');
                const adminBtn = document.getElementById('adminEntryBtn');
                if (nameEl) {
                    nameEl.textContent = user.nickname || user.username;
                }
                if (roleEl) {
                    roleEl.textContent = user.role === 'admin' ? '管理员' : '普通用户';
                    if (user.role === 'admin') {
                        roleEl.classList.add('admin');
                    }
                }
                if (regionEl) {
                    const regionName = user.region_name || (user.role === 'admin' ? '全部区域' : '未分配');
                    regionEl.textContent = `📍 ${regionName}`;
                }
                if (adminBtn && user.role === 'admin') {
                    adminBtn.style.display = 'inline-block';
                }
                window.__currentUser = user;
                console.log('[Index] ✅ 用户信息恢复成功');
            } catch (e) {
                console.warn('[Index] 恢复用户信息失败:', e);
                localStorage.removeItem('user');
            }
        })();

        // ============================================================
        // 折叠/展开分组
        // ============================================================
        window.toggleGroup = function(groupId) {
            const content = document.getElementById(groupId + '-content');
            const arrow = document.getElementById(groupId + '-arrow');
            if (!content) return;

            if (content.style.display === 'none') {
                content.style.display = 'grid';
                if (arrow) arrow.textContent = '▼ ' + arrow.textContent.replace('▶ ', '').replace('▼ ', '');
            } else {
                content.style.display = 'none';
                if (arrow) arrow.textContent = '▶ ' + arrow.textContent.replace('▼ ', '').replace('▶ ', '');
            }
        };

        // ============================================================
        // 区域选择按钮点击处理（全局函数）
        // ============================================================
        window.selectRegion = function(btn, inputId) {
            const group = btn.parentElement;
            group.querySelectorAll('.region-option-btn').forEach(b => {
                b.style.borderColor = '#e2e8f0';
                b.style.background = '#fff';
                b.style.color = '#1e293b';
            });
            btn.style.borderColor = '#2563eb';
            btn.style.background = '#eff6ff';
            btn.style.color = '#2563eb';
            const hiddenInput = document.getElementById(inputId);
            if (hiddenInput) {
                hiddenInput.value = btn.dataset.value;
            }
        };
    </script>

    <!-- ============================================================ -->
    <!-- JavaScript 模块 -->
    <!-- ============================================================ -->
    <script type="module">
        // ============================================================
        // 模块导入
        // ============================================================
        import { API_BASE, get, post, put, del } from '/js/utils.js';
        import { login, logout, getCurrentUser, checkAuth } from '/js/auth.js';
        import {
            loadDevices,
            renderDevices,
            renderTypeTabs,
            renderPagination,
            filterDevices,
            switchType,
            currentPage,
            pageSize,
            currentType,
            searchKeyword,
            setRegionFilter
        } from '/js/devices.js';
        import { startDevice, stopDevice } from '/js/operations.js';
        import { loadStatistics, renderTypeSummary, renderRankTable } from '/js/statistics.js';
        import { formatDuration } from '/js/utils.js';

        // ============================================================
        // 全局状态
        // ============================================================
        let currentUser = null;

        // ============================================================
        // DOM 引用
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const userDisplay = $('#userDisplay');
        const userName = $('#userName');
        const userRole = $('#userRole');
        const userRegion = $('#userRegion');
        const logoutBtn = $('#logoutBtn');
        const currentMonth = $('#currentMonth');
        const totalHours = $('#totalHours');
        const runningCount = $('#runningCount');
        const typeTabs = $('#typeTabs');
        const searchInput = $('#searchInput');
        const deviceCount = $('#deviceCount');
        const deviceGrid = $('#deviceGrid');
        const pagination = $('#pagination');
        const adminEntryBtn = $('#adminEntryBtn');
        const exportBtn = $('#exportBtn');
        const modalOverlay = $('#modalOverlay');
        const modalContent = $('#modalContent');
        const toastContainer = $('#toastContainer');
        const regionFilter = $('#regionFilter');
        const regionFilterWrapper = $('#regionFilterWrapper');

        // ============================================================
        // 页面初始化 - 直接使用 localStorage，跳过 checkAuth
        // ============================================================
        async function init() {
            console.log('[Index] 模块脚本执行');

            // 1. 从 localStorage 读取用户信息
            const savedUser = localStorage.getItem('user');
            if (!savedUser) {
                console.log('[Index] 无用户信息，跳转登录页');
                window.location.href = '/login.html';
                return;
            }

            try {
                currentUser = JSON.parse(savedUser);
            } catch (e) {
                console.warn('[Index] 解析用户信息失败:', e);
                localStorage.removeItem('user');
                window.location.href = '/login.html';
                return;
            }

            // 渲染用户信息
            renderUserInfo(currentUser);
            window.__currentUser = currentUser;

            // 2. 管理员入口控制
            if (currentUser.role === 'admin') {
                adminEntryBtn.style.display = 'inline-block';
                // 管理员显示区域筛选
                regionFilterWrapper.style.display = 'flex';
                await loadRegionOptions();
            } else {
                regionFilterWrapper.style.display = 'none';
            }

            // 3. 设置当前月份
            const now = new Date();
            currentMonth.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月`;

            // 4. 加载设备列表
            await loadDevices();

            // 5. 渲染类型标签
            renderTypeTabs();

            // 6. 渲染设备列表
            renderDevices();

            // 7. 加载统计数据
            await loadStatistics();
            renderTypeSummary();
            renderRankTable();

            // 8. 更新统计栏
            updateStatsBar();

            // 9. 绑定事件
            bindEvents();

            // 10. 加载操作记录
            await loadOperations();

            // 11. 监听设备操作事件，自动刷新操作记录
            window.addEventListener('deviceOperation', function() {
                setTimeout(() => loadOperations(), 300);
            });

            console.log('✅ 设备运行监控系统初始化完成');
        }

        // ============================================================
        // 加载区域下拉选项（管理员专用）- 接口失败时使用硬编码数据
        // ============================================================
        async function loadRegionOptions() {
            const defaultRegions = [
                { id: 1, name: '动力一工段' },
                { id: 2, name: '动力二工段' },
                { id: 3, name: '污水站' },
                { id: 4, name: '罐区' }
            ];

            function fillRegionFilter(regions) {
                regionFilter.innerHTML = '<option value="all">全部区域</option>';
                regions.forEach(r => {
                    const option = document.createElement('option');
                    option.value = r.id;
                    option.textContent = r.name;
                    regionFilter.appendChild(option);
                });
                // 绑定区域筛选事件（避免重复绑定）
                regionFilter.onchange = function() {
                    const regionId = this.value;
                    setRegionFilter(regionId);
                    loadDevices().then(() => {
                        renderDevices();
                        renderTypeTabs();
                        loadStatistics().then(() => {
                            renderTypeSummary();
                            renderRankTable();
                            updateStatsBar();
                        });
                    });
                };
            }

            try {
                const res = await fetch('/api/regions');
                const result = await res.json();
                if (result.success && result.data && result.data.length > 0) {
                    fillRegionFilter(result.data);
                    return;
                }
                console.warn('[loadRegionOptions] 接口返回空数据，使用默认区域');
                fillRegionFilter(defaultRegions);
            } catch (err) {
                console.error('[loadRegionOptions] 接口请求失败，使用默认区域:', err);
                fillRegionFilter(defaultRegions);
            }
        }

        // ============================================================
        // 渲染用户信息
        // ============================================================
        function renderUserInfo(user) {
            userName.textContent = user.nickname || user.username;
            userRole.textContent = user.role === 'admin' ? '管理员' : '普通用户';
            if (user.role === 'admin') {
                userRole.classList.add('admin');
            }
            const regionName = user.region_name || (user.role === 'admin' ? '全部区域' : '未分配');
            userRegion.textContent = `📍 ${regionName}`;
        }

        // ============================================================
        // 更新统计栏
        // ============================================================
        function updateStatsBar() {
            const devices = window.__devices || [];
            const running = devices.filter(d => d.status === 1 && !d.is_deleted).length;
            runningCount.textContent = `${running} 台`;
            const total = window.__statTotalHours || 0;
            totalHours.textContent = `${total} 小时`;
        }

        // ============================================================
        // 绑定事件
        // ============================================================
        function bindEvents() {
            // 退出登录
            logoutBtn.addEventListener('click', async () => {
                try {
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                } catch (e) {
                    console.warn('登出请求失败:', e);
                }
                localStorage.clear();
                window.location.href = '/login.html';
            });

            // 搜索输入（防抖）
            let searchTimer;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    const keyword = searchInput.value.trim();
                    filterDevices(keyword);
                }, 300);
            });

            // 搜索框清除按钮
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchInput && clearBtn) {
                searchInput.addEventListener('input', function() {
                    if (this.value.trim().length > 0) {
                        clearBtn.style.display = 'block';
                    } else {
                        clearBtn.style.display = 'none';
                    }
                });
                clearBtn.addEventListener('click', function() {
                    searchInput.value = '';
                    searchInput.focus();
                    clearBtn.style.display = 'none';
                    filterDevices('');
                });
            }

            // 管理员入口 - 使用内联管理功能
            adminEntryBtn.addEventListener('click', () => {
                if (typeof window.openAdminPanel === 'function') {
                    window.openAdminPanel();
                } else {
                    alert('管理功能加载中，请稍后重试');
                }
            });

            // 导出 Excel（顶部统计栏按钮）
            const exportExcelBtn = document.getElementById('exportExcelBtn');
            if (exportExcelBtn) {
                exportExcelBtn.addEventListener('click', function() {
                    import('/js/export.js').then(module => {
                        const devices = window.__devices || [];
                        const now = new Date();
                        module.exportMonthlyReport(devices, now.getFullYear(), now.getMonth() + 1);
                    }).catch(err => {
                        console.error('[Index] 导出失败:', err);
                        alert('导出功能加载失败，请重试');
                    });
                });
            }

            // 点击模态框外部关闭
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });
        }

        // ============================================================
        // 操作记录
        // ============================================================

        // 加载操作记录
        async function loadOperations() {
            const section = document.getElementById('operationsSection');
            const list = document.getElementById('operationsList');
            const count = document.getElementById('operationsCount');
            const title = document.getElementById('operationsTitle');

            if (!section || !list) return;

            // 检查用户是否登录
            const user = window.__currentUser;
            if (!user) {
                section.style.display = 'none';
                return;
            }

            try {
                const res = await fetch('/api/operations?limit=20');
                const result = await res.json();

                if (!result.success) {
                    console.error('加载操作记录失败:', result.error);
                    section.style.display = 'none';
                    return;
                }

                const logs = result.data || [];

                if (logs.length === 0) {
                    section.style.display = 'block';
                    list.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:16px 0;">暂无操作记录</div>`;
                    if (count) count.textContent = '共 0 条记录';
                    return;
                }

                // 显示区域
                section.style.display = 'block';

                // 标题
                if (title) {
                    title.textContent = user.role === 'admin' ? '📋 操作日志' : '📋 我的操作记录';
                }

                // 计数
                if (count) {
                    count.textContent = `共 ${logs.length} 条记录（最近）`;
                }

                // 渲染列表
                let html = '';
                logs.forEach(log => {
                    const actionText = log.action === 'start' ? '开机' : '停机';
                    const durationText = log.duration_text ? `运行 ${log.duration_text}` : '';
                    const operatorText = user.role === 'admin' ? ` ${log.operator_name}  ` : '';

                    html += `
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #f1f4f9;font-size:14px;">
                            <span>
                                <span style="color:#94a3b8;">${log.created_at}</span>
                                ${operatorText}
                                <span style="font-weight:500;">${log.device_name}</span>
                                <span style="color:#94a3b8;">${log.device_tag}</span>
                                <span style="color:${log.action === 'start' ? '#22c55e' : '#ef4444'};font-weight:500;">${actionText}</span>
                                ${durationText ? `<span style="color:#94a3b8;">${durationText}</span>` : ''}
                            </span>
                        </div>
                    `;
                });

                list.innerHTML = html;

            } catch (err) {
                console.error('加载操作记录异常:', err);
                section.style.display = 'none';
            }
        }

        // 暴露 loadOperations 到全局
        window.loadOperations = loadOperations;

        // ============================================================
        // 模态框控制
        // ============================================================
        window.openModal = function(html) {
            modalContent.innerHTML = html;
            modalOverlay.style.display = 'flex';
        };

        window.closeModal = function() {
            modalOverlay.style.display = 'none';
        };

        // ============================================================
        // Toast 提示
        // ============================================================
        window.showToast = function(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // ============================================================
        // 重新加载设备
        // ============================================================
        window.reloadDevices = async function() {
            await loadDevices();
            renderDevices();
            await loadStatistics();
            renderTypeSummary();
            renderRankTable();
            updateStatsBar();
        };

        // ============================================================
        // 内联管理功能（不依赖 admin.js）
        // ============================================================

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 解析设备参数
        function parseDeviceParams(device) {
            if (!device.params) return null;
            try {
                return typeof device.params === 'string' ? JSON.parse(device.params) : device.params;
            } catch (e) {
                return null;
            }
        }

        // 格式化参数显示
        function renderParamsHtml(params) {
            if (!params) {
                return `<div class="detail-row" style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:8px 0;">暂无参数</div>`;
            }
            const keys = Object.keys(params);
            if (keys.length === 0) {
                return `<div class="detail-row" style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:8px 0;">暂无参数</div>`;
            }
            return keys.map(key => `
                <div class="detail-row">
                    <span class="detail-label">${escapeHtml(key)}</span>
                    <span class="detail-value">${escapeHtml(params[key])}</span>
                </div>
            `).join('');
        }

        // 编辑参数弹窗
        window.editDeviceParams = function(deviceId) {
            const devices = window.__devices || [];
            const device = devices.find(d => d.id === deviceId);
            if (!device) {
                alert('设备不存在');
                return;
            }

            const params = parseDeviceParams(device) || {};
            const keys = Object.keys(params);

            let formHtml = '';
            if (keys.length > 0) {
                formHtml = keys.map(key => `
                    <div class="form-group">
                        <label>${escapeHtml(key)}</label>
                        <input type="text" class="param-input" data-key="${escapeHtml(key)}" value="${escapeHtml(params[key])}" />
                    </div>
                `).join('');
            } else {
                formHtml = `<div style="text-align:center;color:#94a3b8;padding:16px 0;">暂无参数，请添加</div>`;
            }

            const html = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>✏️ 编辑参数 - ${escapeHtml(device.name)}</h2>
                        <button class="modal-close" onclick="window.closeModal()">✕</button>
                    </div>
                    <form id="editParamsForm">
                        <div id="paramsFormBody">
                            ${formHtml}
                        </div>
                        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                            <input type="text" id="newParamKey" placeholder="参数名" style="flex:1;min-width:100px;padding:8px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;" />
                            <input type="text" id="newParamValue" placeholder="参数值" style="flex:1;min-width:100px;padding:8px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;" />

                        <!-- 补录运行模式（start） -->
                        <div id="correctStartFields">
                            <div class="form-group">
                                <label>补录开始时间 *</label>
                                <input type="datetime-local" id="correctStartTime" required />
                            </div>
                            <div class="form-group">
                                <label>补录结束时间 *</label>
                                <input type="datetime-local" id="correctEndTime" required />
                            </div>
                            <div style="font-size:12px;color:#94a3b8;margin-top:-8px;margin-bottom:12px;">
                                ⚠️ 补录时间不能超过当前时间，且开始时间必须早于结束时间
                            </div>
                        </div>

                        <!-- 修正停机模式（stop） -->
                        <div id="correctStopFields" style="display:none;">
                            <div class="form-group">
                                <label>开机时间（系统记录）</label>
                                <input type="text" id="correctStartTimeDisplay" value="${device.current_start_time ? formatTimestamp(device.current_start_time, 'datetime') : '--'}" disabled style="background:#f1f4f9;width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;" />
                            </div>

                                <label>实际停机时间 *</label>
                                <input type="datetime-local" id="correctStopTime" required />

                                ⚠️ 停机时间必须大于开机时间，且不能超过当前时间

                </div>
            `;

            window.openModal(html);

            // ============================================================
            // 模式切换（分段按钮）
            // ============================================================
            const modeStartBtn = document.getElementById('modeStartBtn');
            const modeStopBtn = document.getElementById('modeStopBtn');
            const modeHidden = document.getElementById('correctMode');
            const startFields = document.getElementById('correctStartFields');
            const stopFields = document.getElementById('correctStopFields');
            const startTimeDisplay = document.getElementById('correctStartTimeDisplay');

            function setMode(mode) {
                modeHidden.value = mode;
                if (mode === 'start') {
                    modeStartBtn.style.background = '#2563eb';
                    modeStartBtn.style.color = '#fff';
                    modeStopBtn.style.background = '#f1f4f9';
                    modeStopBtn.style.color = '#94a3b8';
                    startFields.style.display = 'block';
                    stopFields.style.display = 'none';
                    document.getElementById('correctStartTime').disabled = false;
                } else {
                    modeStartBtn.style.background = '#f1f4f9';
                    modeStartBtn.style.color = '#94a3b8';
                    modeStopBtn.style.background = '#2563eb';
                    modeStopBtn.style.color = '#fff';
                    startFields.style.display = 'none';
                    stopFields.style.display = 'block';
                    if (device.current_start_time) {
                        startTimeDisplay.value = formatTimestamp(device.current_start_time, 'datetime');
                    } else {
                        startTimeDisplay.value = '--';
                    }
                    startTimeDisplay.disabled = true;
                }
            }

            modeStartBtn.addEventListener('click', function() {
                if (this.style.background === '#2563eb') return;
                setMode('start');
            });

            modeStopBtn.addEventListener('click', function() {
                if (!isRunning) return;
                if (this.style.background === '#2563eb') return;
                setMode('stop');
            });

            // ============================================================
            // 设置默认时间
            // ============================================================
            const now = new Date();
            const nowStr = now.toISOString().slice(0, 16);
            const todayStr = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0).toISOString().slice(0, 16);

            document.getElementById('correctStartTime').value = todayStr;
            document.getElementById('correctEndTime').value = nowStr;
            document.getElementById('correctStopTime').value = nowStr;

            // ============================================================
            if (isRunning) {
                setMode('stop');
            } else {
                setMode('start');

            // 表单提交

            document.getElementById('correctForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const mode = document.getElementById('correctMode').value;
                const reason = document.getElementById('correctReason').value.trim();

                if (!reason) {
                    alert('请填写原因说明');
                    return;
                }

                let payload = { deviceId, mode, reason };

                if (mode === 'start') {
                    const startTime = document.getElementById('correctStartTime').value;
                    const endTime = document.getElementById('correctEndTime').value;
                    if (!startTime || !endTime) {
                        alert('请填写开始时间和结束时间');
                        return;
                    }
                    const startTs = Math.floor(new Date(startTime).getTime() / 1000);
                    const endTs = Math.floor(new Date(endTime).getTime() / 1000);
                    if (endTs <= startTs) {
                        alert('结束时间必须大于开始时间');
                        return;
                    }
                    if (endTs > Math.floor(Date.now() / 1000)) {
                        alert('结束时间不能超过当前时间');
                        return;
                    }
                    payload.startTime = startTs;
                    payload.endTime = endTs;

                } else {
                    const stopTime = document.getElementById('correctStopTime').value;
                    if (!stopTime) {
                        alert('请填写实际停机时间');
                        return;
                    }
                    const stopTs = Math.floor(new Date(stopTime).getTime() / 1000);
                    if (stopTs > Math.floor(Date.now() / 1000)) {
                        alert('停机时间不能超过当前时间');
                        return;
                    }
                    const startTs = device.current_start_time;
                    if (stopTs <= startTs) {
                        alert('停机时间必须大于开机时间');
                        return;
                    }
                    payload.stopTime = stopTs;
                }

                try {
                    const res = await fetch('/api/records/correct', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('✅ ' + (result.message || '操作成功'));
                        window.closeModal();
                        // 刷新设备列表
                        await loadDevices();
                        renderDevices();
                        // 刷新统计
                        await loadStatistics();
                        renderTypeSummary();
                        renderRankTable();
                        updateStatsBar();
                    } else {
                        alert('❌ ' + (result.error || '操作失败'));
                    }
                } catch (err) {
                    alert('❌ 请求失败: ' + err.message);
                }
            });
        };

        // 格式化时间戳（用于显示）
        function formatTimestamp(timestamp, format = 'datetime') {
            if (!timestamp) return '--';
            const date = new Date(timestamp * 1000);
            const pad = (n) => String(n).padStart(2, '0');
            const y = date.getFullYear();
            const m = pad(date.getMonth() + 1);
            const d = pad(date.getDate());
            const h = pad(date.getHours());
            const min = pad(date.getMinutes());
            if (format === 'date') return `${y}-${m}-${d}`;
            if (format === 'time') return `${h}:${min}`;
            return `${y}-${m}-${d} ${h}:${min}`;
        }

        async function loadDeviceTypes() {
            try {
                const res = await fetch('/api/types');
                const data = await res.json();
                return data.success ? data.data : [];
            } catch (e) {
                console.error('加载类型失败:', e);
                return [];
            }
        }

        // ============================================================
        async function loadRegions() {
            const defaultRegions = [
                { id: 1, name: '动力一工段' },
                { id: 2, name: '动力二工段' },
                { id: 3, name: '污水站' },
                { id: 4, name: '罐区' }
            ];

            try {
                const res = await fetch('/api/regions');
                const data = await res.json();
                if (data.success && data.data && data.data.length > 0) {
                    return data.data;
                }
                console.warn('[loadRegions] 接口返回空数据，使用默认区域');
                return defaultRegions;
            } catch (e) {
                console.error('[loadRegions] 接口请求失败，使用默认区域:', e);
                return defaultRegions;
            }
        }

        // 内联类型管理（带排序、修改、删除）
        async function renderTypeManagementInline() {
            const container = document.getElementById('adminTabContent');
            if (!container) return;

            const types = await loadDeviceTypes();
            const devices = window.__devices || [];

            // 统计每种类型的设备数量
            const typeCounts = {};
            devices.forEach(d => {
                const type = d.type || '未分类';
                if (!typeCounts[type]) typeCounts[type] = 0;
                typeCounts[type]++;
            });

            let html = `

                    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    if (this.dataset.tab === 'devices') renderDeviceManagement();
                    else if (this.dataset.tab === 'types') renderTypeManagementInline();
                });
            });
        };

        // 内联添加设备（支持区域选择 - 点选按钮）
        window._inlineAddDevice = async function() {
            const types = await loadDeviceTypes();
            const typeOptions = types.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
            const regions = await loadRegions();

            const html = `
                <div class="modal-content" style="max-width:520px;width:100%;">
                    <div class="modal-header">
                        <h2>➕ 添加设备</h2>
                        <button class="modal-close" onclick="window.closeModal()">✕</button>
                    </div>
                    <form id="inlineAddDeviceForm">
                        <div class="form-group">
                            <label>设备名称 *</label>
                            <input type="text" id="inlineDevName" placeholder="如：离心式空压机" required style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>位号 *</label>
                            <input type="text" id="inlineDevTag" placeholder="如：07-C201" required style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>型号</label>
                            <input type="text" id="inlineDevModel" placeholder="如：ZH-7000" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>设备类型 *</label>
                            <select id="inlineDevType" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;appearance:auto;min-height:44px;box-sizing:border-box;">${typeOptions}</select>
                        </div>
                        <div class="form-group">
                            <label>位置</label>
                            <input type="text" id="inlineDevLocation" placeholder="如：车间A" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>所属区域 *</label>
                            <div id="inlineDevRegionGroup" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                                ${regions.map(r => `
                                    <button type="button" 
                                            class="region-option-btn" 
                                            data-value="${r.id}"
                                            style="padding:8px 16px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;transition:all 0.2s;color:#1e293b;"
                                            onclick="window.selectRegion(this, 'inlineDevRegion')">
                                        ${r.name}
                                    </button>
                                `).join('')}
                            </div>
                            <input type="hidden" id="inlineDevRegion" value="" />
                        </div>
                        <div class="modal-actions" style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
                            <button type="button" class="btn btn-secondary" onclick="window.closeModal()" style="padding:10px 24px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:14px;">取消</button>
                            <button type="submit" class="btn btn-primary" style="padding:10px 24px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;">确认添加</button>
                        </div>
                    </form>
                </div>
            `;

            window.openModal(html);

            document.getElementById('inlineAddDeviceForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('inlineDevName').value.trim();
                const tag = document.getElementById('inlineDevTag').value.trim();
                const model = document.getElementById('inlineDevModel').value.trim();
                const type = document.getElementById('inlineDevType').value;
                const location = document.getElementById('inlineDevLocation').value.trim();
                const region_id = parseInt(document.getElementById('inlineDevRegion').value);

                if (!name || !tag || !type) {
                    alert('请填写完整信息');
                    return;
                }
                if (!region_id) {
                    alert('请选择所属区域');
                    return;
                }

                try {
                    const res = await fetch('/api/devices', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, tag, model, type, location, region_id })
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('✅ 设备添加成功');
                        window.closeModal();
                        await loadDevices();
                        renderDeviceManagement();
                        if (typeof window.reloadDevices === 'function') {
                            window.reloadDevices();
                        }
                    } else {
                        alert('❌ ' + (result.error || '添加失败'));
                    }
                } catch (err) {
                    alert('❌ 请求失败: ' + err.message);
                }
            });
        };

        // 内联编辑设备（支持区域修改 - 点选按钮）
        window._inlineEditDevice = async function(deviceId) {
            const devices = window.__devices || [];
            const device = devices.find(d => d.id === deviceId);
            if (!device) {
                alert('设备不存在');
                return;
            }
            const types = await loadDeviceTypes();
            const typeOptions = types.map(t =>
                `<option value="${t.name}" ${t.name === device.type ? 'selected' : ''}>${t.name}</option>`
            ).join('');
            const regions = await loadRegions();

            const html = `
                <div class="modal-content" style="max-width:520px;width:100%;">
                    <div class="modal-header">
                        <h2>✏️ 编辑设备</h2>
                        <button class="modal-close" onclick="window.closeModal()">✕</button>
                    </div>
                    <form id="inlineEditDeviceForm">
                        <div class="form-group">
                            <label>设备名称 *</label>
                            <input type="text" id="inlineEditDevName" value="${escapeHtml(device.name)}" required style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>位号 *</label>
                            <input type="text" id="inlineEditDevTag" value="${escapeHtml(device.tag || '')}" required style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>型号</label>
                            <input type="text" id="inlineEditDevModel" value="${escapeHtml(device.model || '')}" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>设备类型 *</label>
                            <select id="inlineEditDevType" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;background:#fff;appearance:auto;min-height:44px;box-sizing:border-box;">${typeOptions}</select>
                        </div>
                        <div class="form-group">
                            <label>位置</label>
                            <input type="text" id="inlineEditDevLocation" value="${escapeHtml(device.location || '')}" style="width:100%;padding:10px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;box-sizing:border-box;" />
                        </div>
                        <div class="form-group">
                            <label>所属区域 *</label>
                            <div id="inlineEditDevRegionGroup" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
                                ${regions.map(r => `
                                    <button type="button" 
                                            class="region-option-btn" 
                                            data-value="${r.id}"
                                            style="padding:8px 16px;border:2px solid ${r.id === device.region_id ? '#2563eb' : '#e2e8f0'};border-radius:8px;background:${r.id === device.region_id ? '#eff6ff' : '#fff'};cursor:pointer;font-size:14px;transition:all 0.2s;color:${r.id === device.region_id ? '#2563eb' : '#1e293b'};"
                                            onclick="window.selectRegion(this, 'inlineEditDevRegion')">
                                        ${r.name}
                                    </button>
                                `).join('')}
                            </div>
                            <input type="hidden" id="inlineEditDevRegion" value="${device.region_id || ''}" />
                        </div>
                        <div class="modal-actions" style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end;">
                            <button type="button" class="btn btn-secondary" onclick="window.closeModal()" style="padding:10px 24px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:14px;">取消</button>
                            <button type="submit" class="btn btn-primary" style="padding:10px 24px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;">保存修改</button>
                        </div>
                    </form>
                </div>
            `;

            window.openModal(html);

            document.getElementById('inlineEditDeviceForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('inlineEditDevName').value.trim();
                const tag = document.getElementById('inlineEditDevTag').value.trim();
                const model = document.getElementById('inlineEditDevModel').value.trim();
                const type = document.getElementById('inlineEditDevType').value;
                const location = document.getElementById('inlineEditDevLocation').value.trim();
                const region_id = parseInt(document.getElementById('inlineEditDevRegion').value);

                if (!name || !tag || !type) {
                    alert('请填写完整信息');
                    return;
                }
                if (!region_id) {
                    alert('请选择所属区域');
                    return;
                }

                try {
                    const res = await fetch(`/api/devices/${deviceId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, tag, model, type, location, region_id })
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('✅ 设备已更新');
                        window.closeModal();
                        await loadDevices();
                        renderDeviceManagement();
                        if (typeof window.reloadDevices === 'function') {
                            window.reloadDevices();
                        }
                    } else {
                        alert('❌ ' + (result.error || '更新失败'));
                    }
                } catch (err) {
                    alert('❌ 请求失败: ' + err.message);
                }
            });
        };

        // 内联删除设备
        window._inlineDeleteDevice = async function(deviceId) {
            if (!confirm('确认删除该设备？历史运行记录将保留。')) return;
            try {
                const res = await fetch(`/api/devices/${deviceId}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    alert('✅ 设备已删除');
                    await loadDevices();
                    renderDeviceManagement();
                    if (typeof window.reloadDevices === 'function') {
                        window.reloadDevices();
                    }
                } else {
                    alert('❌ ' + (result.error || '删除失败'));
                }
            } catch (err) {
                alert('❌ 请求失败: ' + err.message);
            }
        };

        // 内联添加类型
        window._inlineAddType = function() {
            const html = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>🏷️ 添加设备类型</h2>
                        <button class="modal-close" onclick="window.closeModal()">✕</button>
                    </div>
                    <form id="inlineAddTypeForm">
                        <div class="form-group">
                            <label>类型名称 *</label>
                            <input type="text" id="inlineTypeName" placeholder="如：风机" required />
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn btn-secondary" onclick="window.closeModal()">取消</button>
                            <button type="submit" class="btn btn-primary">确认添加</button>
                        </div>
                    </form>
                </div>
            `;
            window.openModal(html);

            document.getElementById('inlineAddTypeForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('inlineTypeName').value.trim();
                if (!name) { alert('请输入类型名称'); return; }
                try {
                    const res = await fetch('/api/types', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('✅ 类型添加成功');
                        window.closeModal();
                        await renderTypeManagementInline();
                        await loadDevices();
                        renderTypeTabs();
                        if (typeof window.reloadDevices === 'function') {
                            window.reloadDevices();
                        }
                    } else {
                        alert('❌ ' + (result.error || '添加失败'));
                    }
                } catch (err) {
                    alert('❌ 请求失败: ' + err.message);
                }
            });
        };

        // 内联修改类型
        window._inlineEditType = function(typeId, currentName) {
            const html = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>✏️ 编辑类型</h2>
                        <button class="modal-close" onclick="window.closeModal()">✕</button>
                    </div>
                    <form id="inlineEditTypeForm">
                        <div class="form-group">
                            <label>类型名称 *</label>
                            <input type="text" id="inlineEditTypeName" value="${escapeHtml(currentName)}" required />
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn btn-secondary" onclick="window.closeModal()">取消</button>
                            <button type="submit" class="btn btn-primary">保存修改</button>
                        </div>
                    </form>
                </div>
            `;

            window.openModal(html);

            document.getElementById('inlineEditTypeForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('inlineEditTypeName').value.trim();
                if (!name) { alert('请输入类型名称'); return; }

                try {
                    const res = await fetch(`/api/types/${typeId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name })
                    });
                    const result = await res.json();
                    if (result.success) {
                        alert('✅ 类型已修改');
                        window.closeModal();
                        await renderTypeManagementInline();
                        await loadDevices();
                        renderTypeTabs();
                        if (typeof window.reloadDevices === 'function') {
                            window.reloadDevices();
                        }
                    } else {
                        alert('❌ ' + (result.error || '修改失败'));
                    }
                } catch (err) {
                    alert('❌ 请求失败: ' + err.message);
                }
            });
        };

        // 内联删除类型
        window._inlineDeleteType = async function(typeId) {
            if (!confirm('确认删除该类型？')) return;
            try {
                const res = await fetch(`/api/types/${typeId}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    alert('✅ 类型已删除');
                    await renderTypeManagementInline();
                    await loadDevices();
                    renderTypeTabs();
                    if (typeof window.reloadDevices === 'function') {
                        window.reloadDevices();
                    }
                } else {
                    alert('❌ ' + (result.error || '删除失败'));
                }
            } catch (err) {
                alert('❌ 请求失败: ' + err.message);
            }
        };

        // ============================================================
        // 启动应用
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
